plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.akin.wallet'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.akin.wallet"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "com.akin.wallet.FixtureTestRunner"


    }

    // Release signing comes from local.properties (never committed):
    //   release.storeFile, release.storePassword, release.keyAlias, release.keyPassword
    // Fail-closed: a release without the key aborts instead of using debug.
    def localProps = new Properties()
    def localPropsFile = rootProject.file("local.properties")
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { localProps.load(it) }
    }
    def hasReleaseKey = localProps.containsKey("release.storeFile")
            && localProps.containsKey("release.storePassword")
            && localProps.containsKey("release.keyAlias")
            && localProps.containsKey("release.keyPassword")

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(localProps["release.storeFile"])
                storePassword localProps["release.storePassword"]
                keyAlias localProps["release.keyAlias"]
                keyPassword localProps["release.keyPassword"]
            }
        }
    }

    // Android's test runner needs Kotlin classes that app-only R8 can remove.
    // Keep instrumentation builds compatible without enlarging shipping APKs.
    def instrumentationRequested = gradle.startParameter.taskNames.any { name ->
        def taskName = name.toLowerCase(Locale.ROOT)
        taskName.contains('androidtest') || taskName.contains('connected') || taskName.contains('devicecheck')
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            // Compact single APK by default; instrumentation stays unminified.
            optimization {
                enable !instrumentationRequested && providers.gradleProperty('optimizeDebug').map { it.toBoolean() }.getOrElse(true)
            }
        }
        release {
            // AGP 9.3+ DSL: R8 code + resource optimization with the default
            // platform rules included. SQLCipher ships its own consumer rules.
            optimization {
                enable true
            }
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }
    def verifyReleaseSigning = tasks.register("verifyReleaseSigning") {
        doLast {
            if (!hasReleaseKey) throw new GradleException("Missing release signing credentials in local.properties")
        }
    }
    tasks.configureEach { task ->
        if (task.name in ["packageRelease", "packageReleaseBundle", "signReleaseBundle"]) task.dependsOn(verifyReleaseSigning)
    }
    buildFeatures {
        buildConfig = true
    }
    // One APK per build type; architecture split outputs are disabled.
    packaging {
        jniLibs {
            // Compress SQLCipher libraries to reduce the standalone APK download.
            useLegacyPackaging = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.recyclerview
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata.core
    implementation libs.appcompat
    implementation libs.biometric
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.sqlcipher
    implementation libs.androidx.sqlite
    constraints { implementation("androidx.viewpager2:viewpager2:1.1.0") }
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"

}

// Lock the application and test graphs; plugin versions are separately pinned.
configurations.configureEach {
    if (name.endsWith("CompileClasspath") || name.endsWith("RuntimeClasspath")) {
        resolutionStrategy.activateDependencyLocking()
    }
}
