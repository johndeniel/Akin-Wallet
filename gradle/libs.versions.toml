[versions]
agp = "9.4.1"
appcompat = "1.8.0"
biometric = "1.1.0"
material = "1.14.0"
constraintlayout = "2.2.2"
sqlcipher = "4.19.0"
androidx-sqlite = "2.7.1"

[libraries]
recyclerview = { module = "androidx.recyclerview:recyclerview", version = "1.4.0" }
lifecycle-livedata-core = { module = "androidx.lifecycle:lifecycle-livedata-core", version = "2.6.2" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version = "2.6.2" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
sqlcipher = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
# sqlcipher-android's POM scopes androidx.sqlite as runtime-only, but its
# SQLiteDatabase type implements SupportSQLiteDatabase, so compilation needs

androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "androidx-sqlite" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
